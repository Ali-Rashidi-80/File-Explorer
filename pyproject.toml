[project]
name = "file-explorer"
version = "5.1.0"
requires-python = ">=3.10"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  build
  | dist
  | \.venv
  | file_explorer\.py
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["build/*", "dist/*", "file_explorer.py"]
known_first_party = ["file_explorer_app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist", "file_explorer.py"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line length handled by black
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
explicit_package_bases = true
exclude = "(build|dist|file_explorer\\.py|/__pycache__/)"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
allow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
]
